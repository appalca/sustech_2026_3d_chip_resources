name: package_copper
location: TW
type: process
unit: unit
amount: 1
properties:
  element: "package"
parameters:
- leads
- package_type
include_in_tree: True
comment: ""
exchanges:
- database: user_database
  name: package_copper_extraction
  type: technosphere
  amount:  # has to be converted in kg
  switch:
    name: package_type
    options:
    - name: qfp_qfn
      amount: 1.8575 * leads / 1000000 # has to be converted in kg
    - name: qfp
      amount: 1.91 * leads / 1000000
    - name: qfn
      amount: 1.05 * leads / 1000000
  input:
    database: ecoinvent-3.11-cutoff
    location: GLO
    name: market for copper, cathode