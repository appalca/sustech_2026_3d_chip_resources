name: package_disag
location: TW
type: process
unit: unit
amount: 1
properties:
  element: "package"
parameters:
- leads
- manuf_location
- package_type
include_in_tree: True
comment: "We follow the assumption that impacts of a package is essentially driven by its quantity of metals and electricity, and that the quantity of metals is correlated with the number of leads (cf. Kuo et al. (2020). Life cycle impact assessment of semiconductor packaging technologies with emphasis on ball grid array.) We model the quantity of gold function of the number of leads using STM32 BoM."
