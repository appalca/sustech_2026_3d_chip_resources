name: stacked_dies
location: GLO
type: process
unit: mm2
amount: 1
parameters:
- area #mm²
- defect_density # defect/mm²
- manuf_location
- three_layers
- first_layer_node
- second_layer_node
- third_layer_node
- hybrid_bondings
- tsvs
- grindings
include_in_tree: True
comment: "Logic die post yields (edge loss and line yield, using murphy's model of die yield)."
exchanges:
- database: user_database
  name: functional_cmos_die_production
  type: technosphere
  amount: "1/pow((1-exp(-1*defect_density*area))/(defect_density*area), 2)"
  parameters_matching: # end users are more likely to manipulate technology node than number of lithography masks. Modeled from data in 'Pirson et al. (2022). The Environmental Footprint of IC Production: Review, Analysis, and Lessons From Historical Trends' supplementary materials.
    first_layer_masks: "137.24 * pow(first_layer_node, -0.317)"
    second_layer_masks: "137.24 * pow(second_layer_node, -0.317)"
    third_layer_masks: "137.24 * pow(third_layer_node, -0.317)"
  input:
    database: user_database
    uuid: logic_die_manufacturing